<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#09090b" />
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon" />
<title>{{ page.title | default: site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

<!-- SEO: Primary Meta Tags -->
<meta name="title" content="{{ page.title | default: site.title }}" />
<meta name="description" content="{{ site.description }}" />
<meta name="author" content="Manish Majhi" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />

<!-- SEO: Open Graph (Facebook, LinkedIn, WhatsApp) -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ site.description }}" />

<!-- SEO: Twitter Card -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:url" content="{{ site.url }}{{ page.url }}" />
<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
<meta name="twitter:description" content="{{ site.description }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
</head>
<body>

<nav class="site-nav">
  <div class="brand">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="prompt"><span class="user">manish</span><span class="at">@</span><span class="host">web</span><span class="path">:~/projects</span><span class="sigil">$</span></span>
    <span class="cmd"><span id="typed"></span><span class="cursor" aria-hidden="true"></span></span>
  </div>
  <div class="links">
    <a class="resume" href="{{ '/Resume/Manish_Majhi-Resume.pdf' | relative_url }}" download>
      <span>Resume</span>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</nav>

<div class="wrap">
  {{ content }}

  <footer>
    <div class="note">&copy; {{ site.time | date: '%Y' }} Manish Majhi</div>
    <div class="links">
      <a href="#" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">&#8599;</span></a>
    </div>
  </footer>
</div>

<script>
  const text = "ls --web";
  const el = document.getElementById('typed');
  let i = 0;
  function type(){
    if(i <= text.length){
      el.textContent = text.slice(0, i);
      i++;
      setTimeout(type, 75);
    }
  }
  type();
</script>

</body>
</html>
