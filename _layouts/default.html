<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#09090b" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2278%22>📟</text></svg>" />
<title>{{ page.title | default: site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

<!-- SEO: Primary Meta Tags -->
<meta name="title" content="{{ page.title | default: site.title }}" />
<meta name="description" content="{{ site.description }}" />
<meta name="author" content="Manish Majhi" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />

<!-- SEO: Open Graph (Facebook, LinkedIn, WhatsApp) -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ site.description }}" />

<!-- SEO: Twitter Card -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:url" content="{{ site.url }}{{ page.url }}" />
<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
<meta name="twitter:description" content="{{ site.description }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<div class="progress" aria-hidden="true"></div>

<nav class="site-nav">
  <div class="brand">Software Engineer</div>
  <div class="links">
    <a class="pill" href="https://www.youtube.com/@CommonShortcomer" target="_blank" rel="noopener noreferrer">YouTube <span aria-hidden="true">&#8599;</span></a>
  </div>
</nav>

<div class="wrap">
  {{ content }}
</div>

<script src="{{ '/assets/js/fx.js' | relative_url }}" defer></script>

</body>
</html>
