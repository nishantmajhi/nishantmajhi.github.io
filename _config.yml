title: "Projects | Manish Majhi"
description: "A curated list of projects by Manish Majhi — spanning Python, Java, C#, JavaScript, browser extensions, and more."
url: "https://nishantmajhi.github.io"
github_username: nishantmajhi

# Repos to leave out of the Index section: this site, other meta repos, and
# repos that should not be on show (KhaataGaata and consultancy are to go private).
# Display only: the GitHub API still returns them, to anyone who asks.
hidden_repos:
  - Blog
  - Album
  - Projects
  - nishantmajhi.github.io
  - KhaataGaata
  - consultancy

# How the Index labels each repository's language: these four share one
# heading, the rest are renamed below, and a repo can be given its own.
combined_label: "JavaScript / HTML / CSS"
combine_languages:
  - JavaScript
  - TypeScript
  - HTML
  - CSS

language_labels:
  Python: "Python"
  Java: "Java"
  C#: "C# [.NET]"
  PHP: "PHP"
  C++: "C++"
  C: "C"
  Shell: "Shell"
  AutoHotkey: "AutoHotKey"

repo_language_overrides:
  ADBS: "Browser Extension"

# The Index groups repositories the way the projects are filed on disk
# (E:\Backups\code): the first folder is the heading, any deeper folders a
# sub-heading under it. A repo missing from this list falls back to its
# GitHub language, labelled as below.
