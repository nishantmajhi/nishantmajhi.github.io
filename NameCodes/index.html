<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Codes</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2278%22>✈️</text></svg>"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap");

      :root {
        /* Airport wayfinding: sign yellow, sign black */
        --sign: #ffd200;
        --ink: #111111;
        --ink-soft: #3a3526;
        --panel: #111111;
        --panel-2: #1c1c1c;
        --seam: #2b2b2b;
        --on-panel: #ffd200;
        --on-panel-soft: #a8944a;
        --on-panel-faint: #5f5733;
        --paper: #fff6c2;
        --good: #22b35e;
        --bad: #e5322d;
        --cond: "Barlow Condensed", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        background: var(--sign);
        color: var(--ink);
        font-family: "Barlow", -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
        padding: clamp(36px, 7vw, 72px) clamp(14px, 4vw, 28px) 56px;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      /* hazard band along the top edge */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 10px;
        z-index: 5;
        background: repeating-linear-gradient(-45deg, var(--ink) 0 14px, var(--sign) 14px 28px);
      }

      .wrap {
        max-width: 860px;
        margin: 0 auto;
      }

      /* ------------------------------------------------------------ header */
      h1 {
        font-family: var(--cond);
        font-weight: 800;
        font-size: clamp(3rem, 10vw, 5.2rem);
        line-height: 0.9;
        text-transform: uppercase;
        letter-spacing: -0.01em;
        margin: 0 0 clamp(24px, 4vw, 36px);
      }
      h1 .ghost {
        -webkit-text-stroke: 2px var(--ink);
        color: transparent;
      }

      /* ----------------------------------------------------- boarding pass */
      .pass {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
      }
      .pass-main,
      .pass-stub {
        background: var(--panel);
        color: var(--on-panel);
        position: relative;
      }
      .pass-main {
        display: flex;
        flex-direction: column;
        border-radius: 14px 0 0 14px;
        padding: 22px clamp(18px, 3.5vw, 30px) 24px;
        /* bites out of the corners where the stub tears off */
        -webkit-mask: radial-gradient(circle 12px at 100% 0, transparent 98%, #000) top / 100% 51% no-repeat,
          radial-gradient(circle 12px at 100% 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
        mask: radial-gradient(circle 12px at 100% 0, transparent 98%, #000) top / 100% 51% no-repeat,
          radial-gradient(circle 12px at 100% 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
      }
      .pass-stub {
        border-radius: 0 14px 14px 0;
        padding: 22px 22px 18px;
        display: flex;
        flex-direction: column;
        -webkit-mask: radial-gradient(circle 12px at 0 0, transparent 98%, #000) top / 100% 51% no-repeat,
          radial-gradient(circle 12px at 0 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
        mask: radial-gradient(circle 12px at 0 0, transparent 98%, #000) top / 100% 51% no-repeat,
          radial-gradient(circle 12px at 0 100%, transparent 98%, #000) bottom / 100% 51% no-repeat;
      }
      /* the perforation */
      .pass-stub::before {
        content: "";
        position: absolute;
        left: 0;
        top: 16px;
        bottom: 16px;
        border-left: 2px dashed var(--on-panel-faint);
      }

      .pass-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: var(--mono);
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--on-panel-soft);
        padding-bottom: 14px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--seam);
      }
      .pass-top b {
        color: var(--on-panel);
      }
      .tag {
        display: block;
        font-family: var(--mono);
        font-size: 0.64rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--on-panel-soft);
        margin-bottom: 4px;
      }

      #firstName {
        width: 100%;
        border: none;
        border-bottom: 3px solid var(--on-panel);
        background: transparent;
        font-family: var(--cond);
        font-weight: 800;
        font-size: clamp(2.2rem, 7vw, 3.4rem);
        line-height: 1.1;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        padding: 2px 0 6px;
        color: var(--paper);
        outline: none;
        border-radius: 0;
        caret-color: var(--on-panel);
      }
      #firstName::placeholder {
        color: var(--on-panel-faint);
      }
      #firstName:focus-visible {
        outline: none;
        border-bottom-color: var(--paper);
      }

      /* the name, letter by letter: what stays is lit, what goes is struck */
      .strip {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 2.6rem;
        margin-top: auto;
        padding-top: 22px;
      }
      .tile {
        font-family: var(--mono);
        font-size: 1.15rem;
        font-weight: 800;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2.1rem;
        height: 2.6rem;
        padding: 0 6px;
        border-radius: 5px;
        transition: background 0.2s, color 0.2s, opacity 0.2s, transform 0.2s;
      }
      .tile small {
        font-size: 0.62em;
        opacity: 0.45;
        margin-left: 1px;
        text-decoration: line-through;
      }
      .tile.kept {
        background: var(--on-panel);
        color: var(--ink);
      }
      .tile.dropped {
        color: var(--on-panel-faint);
        border: 2px dashed var(--seam);
        text-decoration: line-through;
        transform: translateY(5px);
      }
      .tile.ghost {
        border: 2px dashed var(--seam);
      }

      /* ------------------------------------------------------------- stub */
      #output {
        display: flex;
        flex-direction: column;
        gap: 16px;
        flex: 1;
      }
      .code-card {
        position: relative;
      }
      .code-card .label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 0.64rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--on-panel-soft);
        margin-bottom: 2px;
      }
      .code-card .note {
        color: var(--ink);
        background: var(--on-panel-soft);
        padding: 1px 6px;
        border-radius: 3px;
        letter-spacing: 0.06em;
      }
      .code-card .status {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        letter-spacing: 0.08em;
      }
      .code-card .status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .code-card .status.available {
        color: var(--good);
      }
      .code-card .status.taken {
        display: none;
      }
      .code-card .code {
        position: relative;
        display: inline-block;
        font-family: var(--cond);
        font-weight: 800;
        font-size: 2.3rem;
        line-height: 1;
        letter-spacing: 0.08em;
        color: var(--paper);
      }
      .code-card.is-primary .code {
        font-size: clamp(3.6rem, 9vw, 4.6rem);
        color: var(--on-panel);
      }
      /* a taken code gets stamped */
      .code-card.taken .code {
        color: var(--on-panel-faint);
      }
      .code-card.taken .code::after {
        content: "Taken";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) rotate(-10deg);
        font-family: var(--mono);
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        white-space: nowrap;
        color: #fff;
        background: var(--bad);
        border: 2px solid #fff;
        border-radius: 5px;
        padding: 3px 10px 3px 12px;
        box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.8);
        animation: stamp 0.35s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      .code-card.is-primary.taken .code::after {
        font-size: 1.3rem;
      }
      @keyframes stamp {
        from {
          transform: translate(-50%, -50%) rotate(-10deg) scale(2.2);
          opacity: 0;
        }
      }
      .use-btn {
        display: block;
        width: 100%;
        margin-top: 10px;
        font-family: var(--mono);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 2px solid var(--on-panel);
        border-radius: 6px;
        padding: 9px 12px;
        cursor: pointer;
        background: transparent;
        color: var(--on-panel);
        transition: background 0.15s, color 0.15s, transform 0.12s;
      }
      .use-btn:hover {
        background: var(--on-panel);
        color: var(--ink);
      }
      .use-btn:active {
        transform: scale(0.98);
      }
      .code-card.is-primary .use-btn {
        background: var(--on-panel);
        color: var(--ink);
      }
      .code-card.is-primary .use-btn:hover {
        background: var(--paper);
        border-color: var(--paper);
      }
      /* the alternate: label across the top, then the code and its button
         side by side, centred on each other */
      .code-card:not(.is-primary) {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px 12px;
        padding-top: 14px;
        border-top: 1px solid var(--seam);
      }
      .code-card:not(.is-primary) .label {
        flex-basis: 100%;
        margin-bottom: -2px;
      }
      .code-card:not(.is-primary) .use-btn {
        width: auto;
        margin-top: 0;
        padding: 7px 10px;
        font-size: 0.66rem;
      }
      .use-btn:disabled,
      .code-card.is-primary .use-btn:disabled {
        background: transparent;
        border-color: var(--seam);
        color: var(--on-panel-faint);
        cursor: not-allowed;
        transform: none;
      }
      .code-card.alt-slot,
      .code-card.blank .use-btn {
        visibility: hidden;
      }
      .code-card.blank .code {
        color: var(--on-panel-faint);
        letter-spacing: 0.12em;
      }
      .barcode {
        margin-top: 18px;
        height: 34px;
        opacity: 0.55;
        background: repeating-linear-gradient(
          90deg,
          var(--on-panel) 0 2px,
          transparent 2px 4px,
          var(--on-panel) 4px 5px,
          transparent 5px 8px,
          var(--on-panel) 8px 11px,
          transparent 11px 12px,
          var(--on-panel) 12px 13px,
          transparent 13px 17px
        );
      }

      /* ------------------------------------------- board of taken codes */
      .board {
        margin-top: 34px;
        background: var(--panel);
        color: var(--on-panel);
        border-radius: 14px;
        padding: 18px clamp(18px, 3.5vw, 26px) 20px;
      }
      .board-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-family: var(--cond);
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding-bottom: 14px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--seam);
      }
      .board-head .count {
        font-family: var(--mono);
        font-size: 0.85rem;
        color: var(--ink);
        background: var(--on-panel);
        border-radius: 4px;
        padding: 2px 9px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      /* each taken code is a split flap */
      .chip,
      .chips-empty i {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        height: 2.6rem;
        padding: 0 10px 0 14px;
        border-radius: 5px;
        color: var(--on-panel);
        background: linear-gradient(180deg, #262626 0 50%, #1d1d1d 50% 100%);
      }
      .chip::before,
      .chips-empty i::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: rgba(0, 0, 0, 0.8);
      }
      .chip button {
        position: relative;
        border: none;
        background: none;
        color: var(--on-panel-faint);
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
        padding: 2px;
      }
      .chip button:hover {
        color: var(--bad);
      }
      .chips-empty {
        display: flex;
        gap: 8px;
      }
      .chips-empty i {
        width: 5.4rem;
        opacity: 0.45;
      }
      .dir-add {
        display: flex;
        gap: 8px;
      }
      #dirInput {
        flex: 1;
        min-width: 0;
        border: 2px dashed var(--seam);
        border-radius: 6px;
        background: transparent;
        padding: 10px 12px;
        font-family: var(--mono);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        outline: none;
        color: var(--paper);
      }
      #dirInput:focus {
        border-style: solid;
        border-color: var(--on-panel);
      }
      #dirInput::placeholder {
        color: var(--on-panel-faint);
      }
      #dirAdd {
        background: var(--on-panel);
        color: var(--ink);
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
        font-family: var(--mono);
        font-weight: 800;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }
      #dirAdd:hover {
        background: var(--paper);
      }

      :focus-visible {
        outline: 3px solid var(--on-panel);
        outline-offset: 2px;
      }

      /* ---------------------------------------------------------- phones */
      @media (max-width: 680px) {
        .pass {
          grid-template-columns: 1fr;
        }
        .pass-main {
          border-radius: 14px 14px 0 0;
          -webkit-mask: radial-gradient(circle 12px at 0 100%, transparent 98%, #000) left / 51% 100% no-repeat,
            radial-gradient(circle 12px at 100% 100%, transparent 98%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 12px at 0 100%, transparent 98%, #000) left / 51% 100% no-repeat,
            radial-gradient(circle 12px at 100% 100%, transparent 98%, #000) right / 51% 100% no-repeat;
        }
        .pass-stub {
          border-radius: 0 0 14px 14px;
          -webkit-mask: radial-gradient(circle 12px at 0 0, transparent 98%, #000) left / 51% 100% no-repeat,
            radial-gradient(circle 12px at 100% 0, transparent 98%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 12px at 0 0, transparent 98%, #000) left / 51% 100% no-repeat,
            radial-gradient(circle 12px at 100% 0, transparent 98%, #000) right / 51% 100% no-repeat;
        }
        .code-card.alt-slot {
          display: none;
        }
        .pass-stub::before {
          left: 16px;
          right: 16px;
          top: 0;
          bottom: auto;
          border-left: none;
          border-top: 2px dashed var(--on-panel-faint);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>KTM. PKH.<br /><span class="ghost">Now</span> your name.</h1>

      <div class="pass">
        <div class="pass-main">
          <div class="pass-top"><span>Boarding pass</span><b>✈ NC</b></div>
          <label class="tag" for="firstName">From</label>
          <input id="firstName" type="text" placeholder="Your name" autocomplete="off" spellcheck="false" autofocus />
          <div class="strip" id="strip" aria-label="Letters kept and dropped"></div>
        </div>
        <div class="pass-stub">
          <div id="output" aria-live="polite"></div>
          <div class="barcode" aria-hidden="true"></div>
        </div>
      </div>

      <section class="board" aria-label="Codes already taken">
        <div class="board-head"><span>Taken</span><span class="count" id="takenCount">0</span></div>
        <div class="chips" id="chips"></div>
        <div class="dir-add">
          <input id="dirInput" type="text" placeholder="+ Add a code, e.g. GVND" autocomplete="off" spellcheck="false" />
          <button id="dirAdd">Add</button>
        </div>
      </section>
    </div>

    <script src="codes.js"></script>
    <script>
      const usedCodes = new Set();

      // Ghost tiles stand in for a name that has not been typed yet.
      function ghostTiles() {
        return '<span class="tile ghost"></span>'.repeat(4);
      }

      function renderStrip(units, decided) {
        const strip = document.getElementById("strip");
        strip.innerHTML = "";
        if (!units.length) {
          strip.innerHTML = ghostTiles();
          return;
        }
        // A letter pair that sounds as one (sh, kh, chh...) is one tile: the
        // letter that stands for it, with the rest of the pair small and struck.
        decided.forEach((u) => {
          const tile = document.createElement("span");
          tile.className = "tile " + (u.keep ? "kept" : "dropped");
          tile.textContent = u.raw[0];
          if (u.raw.length > 1) {
            const tail = document.createElement("small");
            tail.textContent = u.raw.slice(1);
            tile.appendChild(tail);
          }
          strip.appendChild(tile);
        });
      }

      function codeCardHTML(code, label, isPrimary, note) {
        const taken = usedCodes.has(code);
        return `
    <div class="code-card${isPrimary ? " is-primary" : ""}${taken ? " taken" : ""}">
      <div class="label"><span>${label}</span>${note ? `<span class="note">${note}</span>` : ""}<span class="status ${taken ? "taken" : "available"}">${taken ? "Taken" : "Available"}</span></div>
      <div class="code">${code}</div>
      <button class="use-btn" data-code="${code}" ${taken ? "disabled" : ""}>${taken ? "Already assigned" : "Use this code"}</button>
    </div>`;
      }

      // Holds the alternate's place when there is none, so the pass does not
      // change height as a name is typed. Hidden, and dropped on phones.
      function altSlot() {
        return '<div class="code-card alt-slot" aria-hidden="true"><div class="label"><span>Alt</span></div><div class="code">····</div><button class="use-btn" tabindex="-1">Use</button></div>';
      }

      function renderOutput(primary, secondary) {
        const out = document.getElementById("output");
        // No vowel left makes a code hard to say; flag the alternate that has one.
        const easier = secondary && !/[AEIOU]/.test(primary) && /[AEIOU]/.test(secondary);
        out.innerHTML =
          codeCardHTML(primary, "To", true) +
          (secondary ? codeCardHTML(secondary, "Alt", false, easier ? "+ vowel" : "") : altSlot());
        out.querySelectorAll(".use-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            usedCodes.add(btn.dataset.code);
            renderDirectory();
            compute();
          });
        });
      }

      function renderBlank() {
        document.getElementById("output").innerHTML =
          '<div class="code-card is-primary blank"><div class="label"><span>To</span></div><div class="code">····</div><button class="use-btn" tabindex="-1" aria-hidden="true">Use</button></div>' +
          altSlot();
      }

      function renderDirectory() {
        const chips = document.getElementById("chips");
        document.getElementById("takenCount").textContent = usedCodes.size;
        chips.innerHTML = "";
        if (!usedCodes.size) {
          chips.innerHTML = '<span class="chips-empty" aria-label="None yet"><i></i><i></i><i></i></span>';
          return;
        }
        [...usedCodes].sort().forEach((code) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          const label = document.createElement("span");
          label.textContent = code;
          chip.appendChild(label);
          const x = document.createElement("button");
          x.textContent = "×";
          x.title = "Remove";
          x.setAttribute("aria-label", "Remove " + code);
          x.addEventListener("click", () => {
            usedCodes.delete(code);
            renderDirectory();
            compute();
          });
          chip.appendChild(x);
          chips.appendChild(chip);
        });
      }

      function compute() {
        const first = document.getElementById("firstName").value.trim();
        const { units, decided, primary, secondary } = buildCandidates(first);
        renderStrip(units, decided);

        if (!units.length) {
          renderBlank();
          return;
        }

        renderOutput(primary, secondary);
      }

      document.getElementById("firstName").addEventListener("input", compute);

      document.getElementById("dirAdd").addEventListener("click", addDirCode);
      document.getElementById("dirInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addDirCode();
      });
      function addDirCode() {
        const input = document.getElementById("dirInput");
        const raw = input.value.trim();
        if (!raw) return;
        raw
          .split(/[,\s]+/)
          .filter(Boolean)
          .forEach((code) => usedCodes.add(code.toUpperCase()));
        input.value = "";
        renderDirectory();
        compute();
      }

      renderDirectory();
      compute();
    </script>
  </body>
</html>
